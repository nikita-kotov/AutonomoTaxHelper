[mypy]
python_version = 3.12
files = taxhelper
warn_unused_ignores = True
warn_redundant_casts = True

# The core (rules, calculations, storage) must be fully annotated.
[mypy-taxhelper.calc,taxhelper.dates,taxhelper.deadlines,taxhelper.fx,taxhelper.reports,taxhelper.renta,taxhelper.rent115,taxhelper.settings,taxhelper.filing_calendar,taxhelper.repositories,taxhelper.backup,taxhelper.i18n,taxhelper.db]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-pystray.*]
ignore_missing_imports = True
